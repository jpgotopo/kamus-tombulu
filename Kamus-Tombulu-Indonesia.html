i Yesus. Pahpaan ni Sia é nimaéndo tanu si anak ni domba si pahragés né tou Yahudi wia si Opo Empung wo a singkéla' néra toro ampungan (Yoh. 1:29)."}, {"t": "Asia", "i": "Asia", "d": "Asia im witu ung Kitab Lenas wo Asia in tarékan én zéi'kan masuat. Asia witu ung Kitab Lenas éng kawéténg ung katanaan Asia totoz talikuzan (1Kor. 16:19; Why. 1:4). In ta'un 129 puunala si Yesus i nimatou, sé pemerénta Romawi nimangun ung katanaan Asia kenu nimaéndo esa propinsi, wo um wanua tua'na pahpasungkulan ém witi wanua tua'na Efesus. In tarékan un tana' Asia itii ém witi Turki (Kis. 6:9; Rm. 16:5)."}, {"t": "Ata", "i": "Hamba", "d": "Si tou mahpaayang péléng a méiatu ni tuangna wo zéi'kan mata'u sumaru si tuangna. Ung kukuan in ata én ipahtawah wia sé mahselewir si Opo Empung, ung kalakoana én uli-ulit mahpaayang a méiatu ni Opo Empung."}, {"t": "Babel", "i": "Babel", "d": "Ung kakolanoan kenu im puuna ém witi pinaselat u so'so'an Tigris wo Efrat, in tarékan ém pahkuan Irak. Witu un ta'un 586 puunala si Kristus i nimatou, ung kakolanoan Babel éng kimawasa witi Yerusalem. Wo sé walina im wia sé tou witu é méitia' witi Babel, kauréna 70 ta'un. Witu ung kitap Wahyu wo 1 Petrus 5:13, Babel é ngaran méiandé um wanua tua'na Roma."}, {"t": "Beelzebul", "i": "Beelzebul", "d": "Ngaran ni tonaas né sétang wo né roh léwo' kaapa baal (Mrk. 3:22)."}, {"t": "Diaken", "i": "Diaken, Pelayan, Hamba", "d": "Witu nunuwu'en Yunani un diaken én diakonos. Méitombulu' in téntii: 1. Menenelewir (Mat. 20:26), 2. Memamaayang (1Tim. 4:6), 3. Tou mahwangun a méiatu ni Opo Empung (1Kor. 3:5), 4. Diaken (Fil. 1:1). Diaken ém pahkuan kangkasii ‘Syamas’. Um paayangen néra é mahsawang sé jamaat im wana am pemandungen néra."}, {"t": "Dinar", "i": "Dinar", "d": "Esa dinar ém wawaér wia si tou nimaayang sana endo (Mat. 20:2)."}, {"t": "Dirham", "i": "Dirham", "d": "Witu nunuwu'en Yunani ém pahkuan drakhma. Zua dirham é masuat wo un ipahwaér witi walé ni Opo Empung."}, {"t": "Endo Wangko' Pentakosta", "i": "Pentakosta", "d": "Pentakosta ung kalakoana é ‘limana pulu'’. Endo Wangko' Pentakosta én endo kalimana pulu' kumawusa um Paskah. In endo itii péléng sé tou Israel é maréwok witi Yerusalem. Ni séra éng kumua u makasé wia si Opo Empung pahpaan ang gandum niupu' néramé wana a méitanem néra. Wo mengiit u sirita né aatu ni Yesus, si Opo Empung niméhémé si Roh-Na in endo itii (Kis. 2:1; 1Kor. 16:8)."}, {"t": "Endo Wangko' Pondok Daun", "i": "Pondok Daun", "d": "Endo pahlé'osen né tou Yahudi ing gumenang sé nimaopo néra i nimahwiti-witimé kapelasan wo nimahento'mé wana an terung niatepan uman an zani'na (Ul. 16:13; Yoh. 7:2)."}, {"t": "Endo Wangko' Roti zéi'kan rinagian", "i": "Hari Raya Roti Tidak Beragi", "d": "Im puuna si Opo Empung nimatu sé nimaopo né tou Israel i mangun roti zéi'kan winéhan ragi ung kanen i lumé'os um Paskah, ing gumenang kura séra méiondolé ni Opo Empung im witi Mesir. Sana duminggu ni séra mahgenangla a ragi in tanu a singkéla', niitumo kauré niitu sé tou Israel timia'la péléng a ragi wo mahkan uman a roti zéi'kan winéhan ragi (Mrk. 14:1; Kis. 12:3)."}, {"t": "Firdaus", "i": "Firdaus", "d": "Witu um Pinataazan Uré, kalakoan u ngaran firdaus én ‘uma’, wo un uma itii é méiwéhé ni Opo Empung wia sé tou kataré-taré im wia ung kaayahan puunala ni séra i nimangunla a singkéla'. Witu um Pinataazan Weru, niia én tumuzu'ma witi kasendukan un tampa né roh sé mahpaa-paaz (2Kor. 12:4; Why. 2:7)."}, {"t": "Galilea", "i": "Galilea", "d": "Un tana' Galilea kenu éng kasaruma amian un tana' Israel, un tampa pinahento'ané ni Yesus rengan ing koki'pé' wo kinataréan-Namé i mahpaayang wia si Opo Empung. Sé tou witu ém wéwéhan sé tou Yahudi, wo sé tou zéi'kan Yahudi (Mat. 2:22)."}, {"t": "Herodes", "i": "Herodes", "d": "Lima sé makangaran Herodes. Ni séramo sé mahperénta sé tou Yahudi i sé pemerénta né Romawi kimawasa witi tana' Israel: 1. Kolano Herodes, si kolano mahperénta in oras si Yesus i nimatou. In toro niitu ni sia si nimatu i munu' sé koki' witi Betlehem (Mat. 2:1-12; Luk. 1:5). 2. Herodes Arkhelaus, si kenu én oki' ni kolano Herodes. I si Yusuf, Maria wo si Yesus nimawurimé im witi Mesir, si Yusuf é maindé' wia ni sia pahpaan ni sia én oki' ni Herodes. Niitumo ni séra é manimento' witi Galilea wo zou'mé im wia ni sia (Mat. 2:22). 3. Herodes Antipas, ni sia kangkasii én oki' ni Herodes, si gubernur mahperénta i si Yesus mahwoka' u Nuwu' Lé'os. Ni sia si mahperénta i si Yesus winunu'. Ni sia kasii si nimunu' si Yohanes menanarani (Luk. 3:19-20, 9:7-9, 23:7-12). 4. Herodes Agripa I, ni sia ém puyun ni Herodes, wo kasii nimunu' si Yakobus wo nimuntepa si Petrus witi bui. (Kis. 12:1-23). 5. Herodes Agripa II, si kenu én oki' ni Herodes Agripa I. Ni sia si timalinga um pahéndo-éndoan ni Paulus i ni sia mahkelung un touna (Kis. 25:13–26:32)."}, {"t": "Hosana", "i": "Hosana", "d": "Ung kukuan kenu é nunuwu'en Ibrani, kalakoana ung kataré-taré é milot sé tou im witu un ukuman wana a singkéla', taan ing kamurian é nimaéndomola nunuwu'en né tou Israel i mahlooz si Opo Empung. Tentu kangkasii i sé tou Yahudi mahlooz si Yesus karegas ni Sia muntep witi Yerusalem (Mat. 21:9)."}, {"t": "Kaisar", "i": "Kaisar", "d": "Ung kenu éng kukuan wia si tou totoz mahkawasa witi Romawi. Ni siamo si mahkawasa wana an tana' kinawasa né Romawi. I si Paulus matotozen witu sinaru ni gubernur Festus, si Paulus mahaléi wia si Kaisar in tumotoz um pahéndo-éndoan tumoro ni sia (Kis. 17:7, 18:2)."}, {"t": "Kakolanoan ni Opo Empung", "i": "Kerajaan Allah, Kerajaan Sorga", "d": "Kakolanoan ni Opo Empung é si Opo Empung mahkawasa ing Kolano witi Kasendukan wo wia ung kaayahan. I si Yesus niméyé, si Opo Empung éng kumawasamo ing Kolano (Mat. 4:17), lumousé niitu, ni Sia ém witumo un unez niou (Luk. 17:21; Mat. 5:19; Luk. 4:43)."}, {"t": "Kakolanoan Romawi", "i": "Kerajaan Roma", "d": "I si Yesus nimatoumé witi Israel, sé tou Romawi sé mahperénta witu. Um pahperéntaan né Romawi én totoz tua'na: Witi Eropa Timuh, Afrika Amian, Sendangan Unez wo Asia Talikuzan (Luk. 2:1)."}, {"t": "Kamang tatambér ni Opo Empung", "i": "Anugerah, Kasih Karunia", "d": "Si Opo Empung nimapailek u raraatéan-Na wia sé tou wo sé tou ipilot witu un ukuman wana a singkéla'. Sé tou én zéi'kan mata'u méhé apa uman in ipilot witu un ukuman wana a singkéla', taan si Opo Empung timambér umané niitu."}, {"t": "Karai tonton", "i": "Jubah", "d": ""}, {"t": "Kasendukan", "i": "Sorga", "d": "Walé ni Opo Empung (Why. 14:17)."}, {"t": "Kristus", "i": "Kristus", "d": "Witu u nunuwu'en Ibrani ‘Mesias’ kaapa witu u nunuwu'en Yunani ‘Kristus’ ung kalakoana éng Kolano linoméi si méitaaz wo méiatu ni Opo Empung i milot sé tou im wana a singkéla' (Mat. 16:16)."}, {"t": "Linenas", "i": "Dikuduskan", "d": "Sé tou ma'émano si Yesus Kristus é linenaso ni Opo Empung (Kis. 26:18; 1Kor. 1:2). Sa witu um Pinantik Lenas é méipantik i sé tou ma'émano é léwo'zéi' i lenas im wana am pahwangunen, niitu én téntii: menou-noula karia un até weresi witu u sinaru ni Opo Empung (Rm. 6:19; 1Tes. 4:4)."}, {"t": "Louz Galilea", "i": "Danau Galilea", "d": "U Louz Galilea ém wéwéhan a ngaran walina witu um Pinataazan Weru: Louz Genesaret (Luk. 5:1) wo Louz Tiberias (Yoh. 6:1). An telu ngaran kenu é méingaran witu un esa louz."}, {"t": "Mahkamah Agama", "i": "Mahkamah Agama", "d": "Sé sana réwok tou Yahudi pahpuu-puuna witi Israel. Pinasungkulan né tonaas né walian, sé tou tulap un Torat wo sé pahtu'a-tu'an né Yahudi. Ung kalakez néra ém pituna pulu' tou, wo si tonaas néra é si Walian Wangko'. Ni séramo sé mahkawasa i mahtotoz apa uman u mahmuali wia sé tou Israel wo wana am pa'émanen (Mrk. 15:1; Kis. 5:34-39)."}, {"t": "Mahpiara", "i": "Tuhan", "d": "Witu nunuwu'en Yunani Kurios. Kurios kenu éng kukuan im wia si Yesus, toro kangkasii im wia sé tou uman. Ung kalakoana én tanu ung kenu: Mahpiara ‘Pahkuan wia si Yesus i ni Sia mémoitoumé sumaup im wia sé nimaté’. Tuang ‘Pahkuan wia si Yesus i ni Sia zéi'kampé' méitoumé im wia sé nimaté’."}, {"t": "Mamon", "i": "Mamon", "d": "Ung kalakoana én zoit kaapa a sangkum (Mat. 6:24)."}, {"t": "Méipilot witu un ukuman wana a singkéla'", "i": "diselamatkan", "d": ""}, {"t": "Melkisedek", "i": "Melkisedek", "d": "Si Melkisedek éng Kolano witi Salem. Kalakoan u ngaranna é “Kolano u Mahlé'o-lé'osan.” Ni sia ém “walian ni Opo Empung si Totoz Rakék” si kimamang si Abraham (Kej. 14:18-20). Si Yesus nimaéndo Walian makaz ing kauré-uré, kasuat ni Melkisedek im puuna i nimaéndo walian (Ibr. 5:6; Ibr. 6:20–7:17)."}, {"t": "Menanagi am pajak", "i": "Pemungut cukai", "d": "Witi Israel in tinémpomé ni Yesus, sé menanagi am pajak én tou Yahudi mahpaayang wia sé pemerénta né Romawi. Ni séra é mahtagi wia sé memamangkér wo ipahwéhé wia sé pemerénta Romawi. Sé menanagi am pajak kenu é mahtagi lumakezé an tinotoz né pemerénta Romawi. Niitumo sé tou Yahudi é soo wia sé menanagi am pajak kenu (Luk. 3:12)."}, {"t": "Meresi un tou", "i": "Penyucian diri", "d": "Sa sé tou Yahudi taré mawurimé i nimangémé witi tana' né tou zéi'kan Yahudi, kaapa tanu si wéwéné taré tumoumé si koki', si tou Yahudi itii é léwo'zéi' meresi un tou mengiit ang kinanaram né Yahudi, ung kauréna é esa duminggu (Yoh. 11:55; Kis. 21:24)."}, {"t": "Mesias", "i": "Mesias", "d": "masuat wo si Kristus."}, {"t": "Mur", "i": "Mur", "d": "Un tinanem mahwou tariis, iperaragés wo kangkasii ipahundam kaapa ipahisu' un awak ni tou nimaté i mamoileweng (Mat. 2:11; Mrk. 15:23; Yoh. 19:39)."}, {"t": "Nabi", "i": "Nabi", "d": "Um paayangen méisanapa' méiwéhé ni Opo Empung wia sé tou pinéléng-Na, i mahkua wia sé tou a méikua-Na in esa (Luk. 1:76; 1Kor. 12:28)."}, {"t": "Niéndo Ulit", "i": "Dibenarkan", "d": "Si tou én toro éndon ulit witu sinaru ni Opo Empung pahpaan ma'éman wia si Yesus Kristus (Rm. 3:22; Gal. 2:16). Niitumo mengiit si Opo Empung, si tou ma'éman é sungkulen-Na, zéi'kan ukumen-Na, taan makailek ung katou-touan makaz ing kauré-uré. Si Yesus Kristus si nimuka u lalan, wo sé ma'éman é niéndo ulit witu sinaru ni Opo Empung (1Kor. 1:30; Fil. 3:9)."}, {"t": "Nunuwu'en Aram", "i": "Bahasa Aram", "d": "In tinémpomé ni Yesus, sé tou Yahudi i mendo-endo é mahnuwu' karia u nunuwu'en Aram (Mrk. 5:41, 15:34)."}, {"t": "Nunuwu'en Ibrani", "i": "Bahasa Ibrani", "d": "U nunuwu'en né tou Israel im puuna é nunuwu'en Ibrani, ang kitap Pinataazan Uré ém pinantik karia u nunuwu'en Ibrani. I sé tou Israel kinalama i mahkoro' an ipahwalima witi Babel, im witu pituna pulu' ta'un sé tou Israel mahnuwu' karia u nunuwu'en Aram i mendo-endo, wo pahkaliuzan néramola u nunuwu'en Ibrani. I ni sera nimawurimoma witi Israel, ni séra é mahnuwu'mokan karia u nunuwu'en Aram, wo sé walina mokan sé mata'u u nunuwu'en Ibrani wo kasii pahpakén néra i mahpantik ang kakantaren (Yoh. 5:2; Kis. 21:40)."}, {"t": "Nunuwu'en méitambéré ni Roh Lenas", "i": "Bahasa roh", "d": "U nunuwu'en méitambéré ni Roh Lenas én esaané wana an tatambér ni Roh Lenas. U nunuwu'en itii ém pahpakén wo toro mengaléi mahlooz wo mahsigi' si Opo Empung (1Kor. 12:10, 14:2)."}, {"t": "Nunuwu'en Yunani", "i": "Bahasa Yunani", "d": "U nunuwu'en kinata'uané né tou Israel i ni séra kinawasa ni Aleksander Wangko', wo nimaéndola nunuwu'en i mahperénta wo nimaéndo nunuwu'en pahesa-esaan né tahsasana suzu (Yoh. 19:20; Kis. 21:37)."}, {"t": "Nuwu' Lé'os tumoro si Yesus", "i": "Injil", "d": "Witu nunuwu'en Yunani é ‘euangelion’, ung kalakoana é nuwu' lé'os tumoro si Yesus Kristus. Si Yesus Kristus itii é niméyémo wia ung kaayahan, nimaté wo nimatou sumaup wo séi uman si ma'éman ni Sia ém wéhan ni Opo Empung ung katou-touan makaz ing kauré-uré (Mat. 4:23; Luk. 4:18)."}, {"t": "Nuwu' ni Opo Empung", "i": "Firman", "d": ""}, {"t": "Oki'", "i": "Anak, anak-Ku", "d": "Makawoopira si Yesus kimua oki' wia sé tou tu'amo, karia kangkasii wia sé pahtuzu'en-Na. Pahtawahen-Na téntu pahpaan ni Sia rumaraaté sé tou itii. Téntu kangkasii si Paulus é mahtawah si Timotius in oki', wo si Yohanes kasii é mahtawah oki' wia sé tou witi jamaat winéhannama um pinantikna. Witu ung kinanaram né mahtombulu' én zéi'kan mamuali ing kumua oki' wia sé tu'amo. Niitumo méipantik uman ina' kaapa ama' (Mrk. 2:5, 5:34; Luk. 8:48)."}, {"t": "Oki' ni Opo Empung", "i": "Anak Allah", "d": "Ung kalakoana, si Yesus Kristus én Oki' ni Opo Empung kaapa masuat wo si Opo Empung (Yoh. 5:18). Si Yesus niméyé wia ung kaayahan zéi'kan masuat wo ung kinanaram, taan karia ung kawasa ni Roh Lenas wo ni Opo Empung (Luk. 1:35). Si Yesus é si Opo Empung in esa si niméyé wia ung kaayahan (Yoh. 1:14). Sé tonaas né tou Yahudi wo kasii si gubernur Pilatus limigaula wia ni Sia sa ni Sia Oki' ni Opo Empung kaapa zéi'kan. Mengiit ni séra, zéi'kan mamuali si Opo Empung méyé wia ung kaayahan in tou uman (Mat. 26:63; Yoh. 1:34, 10:36)."}, {"t": "Oki' ni Tou", "i": "Anak Manusia", "d": "Ung kukuan kenu ém pengunguan ni Yesus tumoro un tou-Na in esa. Si Yesus niméndomé ung kukuan kenu witu ung kitap Daniel 7:13-14. Ni sia éng kimua in Oki' ni Tou i mapata'u i ni Siamo si milot sé tou im witu un ukuman wana a singkéla' tanu u méikua ni nabi Daniel im puuna. Ung kalakoan kukuan kenu én zéi'kan tumuzu'mé i si Yesus én tou uman, taan ni Sia nimaké ung kukuan kenu i ni Sia niméhé ampung wana a singkéla' né tou, wo witu un endo kaakazan ung kaayahan i ni Sia méyé sumaup (Dan. 7:13-14; Mrk. 2:10)."}, {"t": "Opo-opo", "i": "Berhala", "d": "Apa uman am pa'émanen né tou im wéwéhan ung kaenté'an lumousé sé tou uman, kaapa pahgenangela in tanu si Mahpiara mengiit ni séra. Wéwéhan ang kai am wangunen, watu, tambaga, péra' wo a mas (Kis. 7:40; Rm. 2:22; 1Kor. 5:10)."}, {"t": "Pahtunuan a raragés", "i": "Mezbah", "d": "Am pahtunuan a raragés kenu én tanu a rampozan. Um witi untep um Walé ni Opo Empung um pahtunuan ang kamania éng kai sinaputo u mas am wangunen (Why. 8:3-4), wo um witi lésaz um Walé ni Opo Empung um pahtunuan sé tatamun ém perunggu am wangunen (Why. 6:9)."}, {"t": "Pa'opoen", "i": "Dewa, Dewi", "d": "Sé pa'émanen né tou in tanu si Mahpiara. Wéwéhan ang kai am wangunen, watu, tambaga, péra' wo mas (Kis. 7:43; Ef. 6:12)."}, {"t": "Paskah", "i": "Paskah", "d": "Si Opo Empung é nimatu sé tou Israel i léwo'zéi' mahlé'os um Paskah sumekez in ta'un. U mahlé'os um Paskah kenu én endo ing gumenang si Opo Empung nimiloté sé nimaopo né tou Israel im witi Mesir (Kel. 12:1-51). Um pelélé'osen itii ém pahlé'osen néra rengané im witu un tinémpomé um Pinataazan Uré makaz si Yesus i niméyé (Mat. 26:1-5; Luk. 2:41-42). Um Paskah in toro niitu én zéi'kan masuat wo um Paskah né tou sarani in tarékan. Um Paskah in tarékan én endo ing gumenang si Yesus Kristus méitoumé sumaup ni Opo Empung."}, {"t": "Penanahu'an anggor", "i": "Kantong kulit", "d": "Tinémpomé im puuna sé tou é melélé'os an anggor wana an tampa ang kulit né liontana' am wangunen. An anggor weru ém pahtahu' néra wana am penanahu'an weru wo zéi'kan mawenta' sa niitu sumegahmé, pahpaan ung kulit werupé' én toro mahrenét wo un anggor wo un tampana kangkasii én toro ikauré. Si Yesus mahtuzu' wia sé tou Farisi wo an tutuzu'-Na én zéi'kan mata'u pasemboren wo an tutuzu' uré né tou Farisi."}, {"t": "Penatua", "i": "Penatua", "d": "Witu u nunuwu'en Yunani ‘Presbuteros’, ung kalakoana é si tonaas né jamaat kaapa si tu'amo. Um paayangen néra é mahwali-wali wo mahtuzu' sé jamaat tumoro an tutuzu' ni Opo Empung (Kis. 14:23)."}, {"t": "Peraragésan", "i": "Mezbah", "d": "Tampa pahwéhan a raragés é masuat wo u méja, wo um wawona ém pezezetaan a raragés wia si Opo Empung. Kanaramen an ipahwéhé witu é sé tatamun pahtunun, wo sé mahwangun niana é sé walian (Mat. 5:23; 1Kor. 9:13)."}, {"t": "Petrus", "i": "Petrus", "d": "Petrus é ngaran walina ni ‘Simon’. I ni sia nimaéndola pahtuzu'en ni Yesus a sia ngaranala ni Yesus im ‘Petrus’. Petrus é nunuwu'en Yunani, wo ‘Kefas’ é nunuwu'en Aram, un zua ngaran itii ung kalakoana ém ‘watu karang’. Ni sia én totoz mahtuari wo si Andreas (Mat. 4:18; Yoh. 1:42)."}, {"t": "Pilatus", "i": "Pilatus", "d": "Pilatus é si gubernur Romawi si mahkawasa witi tana' Yudea, Samaria wo Idumea. Ni sia si mahkawasa witu i Si Yesus méisaru wia sé pemerénta né Romawi (Mat. 27:2; Luk. 13:1)."}, {"t": "Pinantik Lenas", "i": "Kitab Suci, Tulisan Suci, Firman", "d": "Ung kukuan kenu ém pahpakén witu um Pinataazan Weru in tumuzu' am pinantik méikapantik witu um Pinataazan Uré (Mat. 4:4)."}, {"t": "Roh Lenas", "i": "Roh Kudus", "d": "Wéwéhan woopira ngaran pengunguan tumoro si Roh Lenas: Roh ni Opo Empung (Rm. 8:9), Roh ni Mahpiara (2Kor. 3:17), Roh ni Yesus (Kis. 16:7), Roh ni Oki' ni Opo Empung (Gal. 4:6). Si Roh lenas é mahpaayang i mahenté' un até kaapa tumulung in tumuzu' an ulit tumoro si Opo Empung. Ni sia é mangé mahwali-wali karia né tou ma'éman (Yoh. 14:16-17). Ung kawasa ni Roh Lenas é mangun si tou zéi'kan maindé' i mapata'u tumoro si Yesus (Kis. 1:8). Ni sia kangkasii é mangun ni kita i mata'u sa ni kita én Oki' ni Opo Empung (Rm. 8:15-16)."}, {"t": "Roh léwo'", "i": "Roh Jahat", "d": "Ang kawasa kimawasa wia sé tou wo mahenou sé tou i mangun a singkéla', wo kangkasii toro mangun si tou i masaki (Why. 16:13)."}, {"t": "Roh ni Mahpiara", "i": "Roh", "d": "Sa kukuan witu um Pinantik Lenas Roh kaapa Roh ni Mahpiara. Sa witu un Tombulu é ‘Roh ni Opo Empung’."}, {"t": "Roh ni Oki' ni Tou", "i": "Roh Anak Allah", "d": "Masuat wo si Roh Lenas."}, {"t": "Roh ni Opo Empung", "i": "Roh Allah", "d": "Masuat wo si Roh Lenas."}, {"t": "Roh ni Yesus", "i": "Roh Yesus", "d": "Masuat wo si Roh Lenas."}, {"t": "Roko' aapé'", "i": "Tabir Bait Suci", "d": "U roko' aapé' kenu én ipahapé' witu un tampa pahéyéan ni Opo Empung um pahkuan Tampa Totoz Lenas witi Walé ni Opo Empung. Akaz uman si Walian Wangko' si toro muntep witu, makasa uman sumekez in ta'un. Niitumo, i nimapahzuama u roko' itii, tumuzu'mé un Tampa totoz Lenas itii én zéi'mo méisanapa' im pahéyéan uman ni Opo Empung wia ung kaayahan, taan rengan in toro niitu wisa uman um wéwéhan sé tou ma'éman, si Opo Empung ém witu (Ibr. 6:19)."}, {"t": "Sabat", "i": "Sabat", "d": "Un endo né tou Yahudi i mahragés wo endo ni séra in zéi'kan mata'u maayang. Endo Sabat én endo kapitu rékénené kumatarémé witu un endo duminggu. Un endo itii é har Sabtu (Kel. 20:8; Mat. 12:1-8)."}, {"t": "Sana réwok tou Farisi", "i": "Farisi", "d": "Sana réwok tou Yahudi sé totoz mahkiit un Ukum Torat u méipapata'u ni Musa, makaz an tinotoz itii ém pahawesan néramo (Mat. 22:15)."}, {"t": "Sana réwok tou Saduki", "i": "Saduki", "d": "Sé sana réwok im wia sé tou Yahudi. Ni séra én totoz mahkiit an tinotoz witu ung kitap Torat, taan ni séra én zéi'kan mahkiit tanu am pahkiiten né tou Farisi. Lakez im wia sé tou Saduki sé nimaéndo walian wo ni séra ém wia sé tou pahpuu-puuna witi Israel a méyé. Ni séra sé mengingimek um walé ni Opo Empung wo lakez im wia ni séra sé méikauntep witi Mahkamah Agama. Zéi'kan pa'émanen néra sa sé nimatémo én itou sumaup (Mat. 22:23-33; Kis. 5:17)."}, {"t": "Sétang", "i": "Iblis", "d": "Si Roh léwo' si toro kumawasa wia si tou makaz si tou mahwangun a singkéla'. Ni sia kasii én toro mangun si tou i masaki. Méipantik witu um Pinantik Lenas é lakez sé sétang. Taan si tonaas néra én esa uman, ni siamo si pahkuan tonaas né sétang (Mat. 4:1; Yak. 4:7)."}, {"t": "Sigi' wo looz", "i": "Mulia", "d": "Ung kukuan kenu én tumuzu'mé ung kawangko' ni Opo Empung un zéi'mo kakuaan."}, {"t": "Sunat", "i": "Sunat", "d": "Sé tou Yahudi é mahsunat sé oki' néra in taré waluna endo i nimatoumé. U sunat én tanda pinataazan ni Opo Empung wo né tou Yahudi im puuna. Wo u sunat kangkasii én tumuzu'mé sé tou Yahudi im wia sé tou zéi'kan Yahudi sé zéi'kan ma'éman si Opo Empung. Taan un totoz pahpuu-puuna u sunat én tanda i sé tou Yahudi én tou ni Opo Empung. Witu um Pinataazan Weru, sé tou sarani én zéi'kan totoz ipekisunat. Si Paulus éng kimua in téntu, pahpaan si Yesus si nimilot sé tou im witu un ukuman wana a singkéla' (1Kor. 7:18-19; Gal. 5:2-6)."}, {"t": "Suzu ni Daud", "i": "Anak Daud", "d": "Im puuna si Opo Empung kimua un taaz-Na wia si Daud in esaané im wia sé suzuna é maéndo Kolano makaz ing kauré-uré. Niitumo i sé tou Yahudi mengento-ngento' u méitaaz ni Opo Empung itii, ni séra é ma'ento' si suzu ni Daud. I si Yesus niméyé, lakez sé tou mata'u i ni Siamo si méitaaz ni Opo Empung, niitumo ni séra é mahlooz ni Sia i ni Sia muntepo witi Yerusalem wo mahkua ni Sia i suzu ni kolano Daud (Mat. 1:1; 2Tim. 2:8)."}, {"t": "Talenta", "i": "Talenta", "d": "Witu nunuwu'en Yunani ‘talanton’. Un esa talenta é masuat wo u enemna riwu dinar. Un ipahwaér wia si tou nimaayang sana endo in toro niitu én esa dinar (Mat. 18:24)."}, {"t": "Tali i mengaléi", "i": "Tali sembayang", "d": "Un tali i mengaléi én tali linempaz wo un tatahu'an oki' ung kawal am wangunen. Tinahu'an am pinantik lenas u méiapus witu lawasna u lengen kawihi wo witu un tungtung ni tuama né tou Yahudi. Witu u nunuwu'en Yunani ém pahkuan im ‘phulakterion’. Niana ém pengangalin né tou Yahudi sa mengaléi (Mat. 23:5)."}, {"t": "Tatahu'an um Pinataazan", "i": "Tabut Perjanjian", "d": "Ung kas kenu éng kai am wangunen, un tumuzu'mé i si Opo Empung é menaté-natér sé tou-Na. Ung kas itii én tinahu'an um watu lempaz zua, pinantikan u mapulu' Ukum ni Opo Empung. Witu um wawona ém wéwéhan um pahkuan kekelew pahlé'osan. Si Daud é nimérama ung kas itii an iwéhénala witi Walé ni Opo Empung witi Yerusalem (Ibr. 9:4; Why. 11:19)."}, {"t": "Ténda ni Opo Empung", "i": "Kemah Suci", "d": "Im puuna si Opo Empung nimatu si Musa i mangun un ténda esa i ni séra méiondolé im witi Mesir. Un ténda itii én tampa pahéyéan ni Opo Empung (Kel. 25:1-9, 40:33-34, 38). Wéwéhan kasii un témpona méhé a raragés witu. Niitu kangkasii ém pahréwokana né walian i mengaléi wia si Opo Empung. Taan un ipahpuu-puuna im witu én tampa pahéyéan ni Opo Empung. Niitumo un ténda itii én tumuzu'mé i si Opo Empung é menaté-natér sé tou-Na (Kis. 7:44)."}, {"t": "Tonaas né jemaat", "i": "Pengawas Jemaat", "d": "Sé mahwali-wali sé jamaat mahtuuz wo mahsawang sé tou ma'émano wia si Yesus (Fil. 1:1; 1Tim. 3:1)."}, {"t": "Tonaas né sétang", "i": "Iblis", "d": "Mengiit a méipantik witu um Pinantik Lenas é lakez sé sétang. Taan si tonaas néra én esa uman, ni siamo si tonaas né sétang (Mat. 4:1; Yak. 4:7). Wéwéhan kasii u ngaran walina um pinaké witu um Pinantik Lenas kenu, tanu u: si léwo' (Mat. 6:13), tantowo kaapa ama' péléng né tantowo (Yoh. 8:44), si ulé' tu'a (Why. 12:9)."}, {"t": "Tonaas né suraro", "i": "Perwira", "d": "Im wia sé Romawi, ‘si tonaas né sana atus suraro’ ém pahkuan senturion. Niitumo un totoz rakék im wana am paayangen né suraro, un toro kaayoan né tou kanaramen uman (Mat. 8:5; Luk. 7:2)."}, {"t": "Tonaas né Walian", "i": "Imam-imam Kepala", "d": "Sé sana réwok walian sé pahsigi-sigi'en né tou Yahudi. Ni séra sé pahpuu-puuna im witu Mahkama Agama né tou Yahudi. Ni séra ém pahpéléngané sé maéndo Walian Wangko' (Mat. 21:15; Kis. 9:14)."}, {"t": "Tou mahsaru si Opo Empung", "i": "Orang Fasik):", "d": "."}, {"t": "Tou Romawi", "i": "Warga Negara Roma", "d": "Pahpaan um pahperéntaan né Romawi én totoz selah wo totoz kangkasii ipahkua-kua, niitumo lakez sé zéi'kan tou Romawi ém paaz maéndo tou Romawi. In toro niitu, sé pemerénta witi Romawi én toro mangun séi uman i maéndo tou Romawi, sa ni sia limé'osla am wangun wia sé pemerénta Romawi. Sé urémo i nimaéndo tou Romawi, toro kangkasii rumorosla niitu wia sé oki' néra i maéndo tou Romawi (Kis. 22:28b)."}, {"t": "Tou Samaria", "i": "Orang Samaria", "d": "Im puuna sé mapulu' wo zua suzu né Israel mahwiti-witi tana' Israel amian, ni séra ém pahkuan ‘Tou Samaria’. Sé zua suzu walina né tou Israel ém pahkuan ‘Tou Yahudi’. Ni séra é mahento' witi tana' Israel kasaru Timuh. Sé zuana réwok tou Israel kenu én zéi'kan mahéndoan. Sé tou Yahudi mahgenangla sé tou Samaria én zéi'kan uli-ulit mahkiit si Opo Empung wo an tinotoz witu un ukum Torat. Sé tou Samaria éng kimawéngo wo sé tou Mesopotamia wo Siria. Sé tou Yahudi kasii é mahkua sé tou Samaria é nimaéndomo makati'tiren. Niitumo ni séra é soo mahkari-karia sé tou Samaria (Yoh. 4:9, 8:48)."}, {"t": "Tou Tulap un Torat", "i": "Ahli Taurat", "d": "Ung kukuan kenu ém pahpakén wia sé sana réwok tou Farisi sé totoz mata'u ung kitap Torat. Un Torat kenu é lima kitap méikataré witu um Pinataazan uré (Kejadian, Keluaran, Imamat, Bilangan, Ulangan). Ni séra é mahtuzu' tumoro a méipantik witu un Torat wia sé tou Yahudi. Ni séra kangkasii é nimaéndo menénésa i mapata'u wia sé tou Yahudi, kura i menou-nou mengiit un Torat i mendo-endo, taka-takazan ni séra kangkasii ém penanawahen i sumawang tumotoz sé tou simala'mo witu un Ukum Torat (Mat. 8:19; Mrk. 12:28)."}, {"t": "Tou Yahudi", "i": "Orang Yahudi", "d": "Tou Yahudi é sé tou pinéléng ni Opo Empung rengan im puuna, ing kataré-taré ém pahkuan tou Ibrani, kauréna ém pahkuano tou Israel. In tinémpomé ni Yesus ém pahkuan in tou Yahudi. Niitu é masuat wo u ngaran né sana suzu im wia sé nimaopo ni Yesus Kristus. Sé tou Yahudi kenumo sé pinéléng ni Opo Empung ing kataré-taré pinapata'uan u Nuwu' Lé'os (Rm. 3:2)."}, {"t": "Tou zéi'kan Yahudi", "i": "Bangsa bukan Yahudi, orang bukan Yahudi", "d": "Tou zéi'kan Yahudi é sé tou zéi'kan suzu né tou Yahudi. Si Opo Empung nimatu si Paulus i mahwoka' u Nuwu' Lé'os tumoro si Yesus wia sé tou zéi'kan Yahudi wo séra ma'éman wo toro ipilot im witu un ukuman wana a singkéla' (Ef. 3:6-8; 1Tes. 2:16; 1Tim. 2:7)."}, {"t": "Tou Zelot", "i": "Gerakan Yahudi merdeka", "d": "Sé tou Zelot é sana réwok tou Yahudi sé mahtututu' i mahpipilot sé tou Israel im witu ung kawasaan né Romawi (Mat. 10:4)."}, {"t": "Ukum Torat", "i": "Hukum Taurat", "d": "U lima kitap witu un Taaz Uré ém pahkuan Torat (Kejadian, Keluaran, Imamat, Bilangan, Ulangan). Wana ang Torat kenu é lakez a léwo'zéi' im pahkiiten, wo sé tou Israel mahkiit uman um paaz ni Opo Empung. U Mapulu' Ukum ni Opo Empung é méikauntep witu un Torat, wo lakez kasii am walina. An tinotoz witu un Ukum Torat kangkasii ém pahkuan Ukum ni Musa, si nimantik u lima kitap kataré witu un Taaz Uré (Im. 27:34; Mat. 8:4)."}, {"t": "Walé ni Opo Empung", "i": "Bait Allah", "d": "Witu um Walé ni Opo Empung ém wéwéhan un tampa Totoz Lenas. Si Walian wangko' sekez in ta'un é makasa muntep witu un tampa Totoz Lenas itii i mahali un iragés wia si Opo Empung. Um Walé ni Opo Empung witi Yerusalem winanguna ni Salomo a léwo'ena né tou Babel 586na ta'un puunala si Yesus i nimatou. Ta'un 515 puunala si Yesus i nimatou, ing kimawusoma sé tou Israel i méitia' witi Babel, um walé ni Opo Empung winangun sumaup ni Zerubabel. In tinémpomé ni Yesus, niitu é nimaéndo pahpasungkulan péléng né tou i mahragés, wo apa uman um pahwangunen né tou Yahudi. Sé tou sarani ing kataré-taré é mahragés mahwali-wali witu, taan kauréna é nimatampasanola karia né tou Yahudi. Um walé ni Opo Empung itii é linéwo'ma né suraro Romawi sé ipahwali-wali ni makangaran Titus witu un ta'un 70 (Mat. 24:1-2; Luk. 1:8-22)."}, {"t": "Walé Peraragésan", "i": "Rumah Ibadat", "d": "Um walé peraragésan né tou Yahudi witu u nunuwu'en Ibrani é ‘Sinagoge’, tampa pahragésan i mahtata'u u Nuwu' Lé'os (Mat. 12:9)."}, {"t": "Walian", "i": "Imam", "d": "Um papaayangen totoz pahsigi'en im wia sé tou Yahudi. Péléng sé walian én ipahsekez i mahpaayang witi walé ni Opo Empung. Um paayangen néra é mahtunu ang kamania, mahwéhé a raragés né tou wia si Opo Empung wo am walina. Péléng sé walian ém wia sé suzu ni Lewi a méyé, esaané wia sé suzu né tou Israel. Witu ung kinanaram né tou Minahasa, sé walian é mengangali u raragés wia sé opo-opo wo sé opo méhémé um pahaléien né tou (Mat. 8:4; Luk. 1:5-10)."}, {"t": "Walian Wangko'", "i": "Imam Besar", "d": "Um papaayangen totoz rakék im wia sé tou Yahudi ém Walian Wangko'. Ni sia én tonaas péléng né walian, wo kangkasii tonaas né Mahkama Agama Yahudi. Si Walian wangko' né tou Yahudi én esa uman. Um paayangena é mahuntep witu un tampa totoz lenas witi Walé ni Opo Empung makasa uman witu u sana ta'un."}, {"t": "Wanua tua'na Roma", "i": "Kota Roma", "d": "U Roma kenu ém wanua tua'na witi pahperéntaan né Romawi wo wanua tumua-tua'na wana péléng am wanua tua'na. Niitu é méikawawo witu um pitu kimeleng. Witi wanua tua'na itii wéwéhan kangkasii sé tou sarani taan zéi'kan si Paulus si kataré-taré nimahwoka'ma u Nuwu' Lé'os wia ni séra (Rm. 1:7-15; 2Tim. 1:17)."}, {"t": "Zoit", "i": "Uang", "d": "Witu um Pinataazan Weru ang kukuan pinaké é lakez, nimahwali-walinaan wo zéi'kan masuat an tetelesna. Péléng niitu é méipantik uman mengiit ung kukuan in toro niitu: talenta, mina, stater, dinar wo dirham Witu un Tombulu méipantik un zoitna karia un toro katelesan niitu, wo kata'uan wisa un zoit rintek wo wisa un zoit lo'ap."}], "prop": [{"t": "Abadon", "ty": "lain", "id": "Abadon (berarti Perusak)"}, {"t": "Abagta", "ty": "orang", "id": ""}, {"t": "Abda", "ty": "orang", "id": ""}, {"t": "Abdon", "ty": "orang", "id": ""}, {"t": "Abel-Bet-Maakha", "ty": "tempat", "id": ""}, {"t": "Abel-Keramim", "ty": "tempat", "id": ""}, {"t": "Abel-Mehola", "ty": "tempat", "id": ""}, {"t": "Abi", "ty": "orang", "id": ""}, {"t": "Abia", "ty": "orang", "id": ""}, {"t": "Abiam", "ty": "orang", "id": ""}, {"t": "Abida", "ty": "orang", "id": ""}, {"t": "Abiezer", "ty": "bangsa", "id": ""}, {"t": "abiezer", "ty": "orang", "id": ""}, {"t": "abigail", "ty": "orang", "id": ""}, {"t": "Abihail", "ty": "orang", "id": ""}, {"t": "Abimael", "ty": "orang", "id": ""}, {"t": "Abimelekh", "ty": "orang", "id": ""}, {"t": "abimelekh", "ty": "orang", "id": ""}, {"t": "Abinoam", "ty": "orang", "id": ""}, {"t": "Abiram", "ty": "orang", "id": ""}, {"t": "Abisag", "ty": "orang", "id": ""}, {"t": "abisai", "ty": "orang", "id": ""}, {"t": "Abisalom", "ty": "orang", "id": ""}, {"t": "Abner", "ty": "orang", "id": ""}, {"t": "abner", "ty": "orang", "id": ""}, {"t": "Abraham", "ty": "orang", "id": ""}, {"t": "abram", "ty": "orang", "id": ""}, {"t": "Absalom", "ty": "orang", "id": ""}, {"t": "Abyatar", "ty": "orang", "id": ""}, {"t": "Adalya", "ty": "orang", "id": ""}, {"t": "adam", "ty": "orang", "id": ""}, {"t": "adar", "ty": "korpus", "id": ""}, {"t": "Admata", "ty": "orang", "id": ""}, {"t": "Adoni-Bezek", "ty": "orang", "id": ""}, {"t": "Adonia", " const UI = {"stat_main": "Menampilkan <b>{shown}</b> dari {total} entri &middot; total: {all} ({A} A / {B} B)", "stat_glos": "Glosarium: <b>{shown}</b> / {total} istilah", "stat_prop": "Nama diri: <b>{shown}</b> / {total}", "stat_morf": "Morfologi: {shown} pola", "no_results": "Tidak ada hasil untuk “{q}”.", "morf_note": "Pola imbuhan & kata tugas yang sering muncul — untuk menafsirkan bentuk berimbuhan yang tak tercantum sebagai lema.", "kinds": {"palabra": "kata", "frase": "frasa", "raiz": "akar (bentuk dasar)"}, "types": {"orang": "orang", "tempat": "tempat", "bangsa": "bangsa/suku", "lain": "lain-lain", "korpus": "nama (korpus)"}, "col_source": "Tombulu", "col_gloss": "Bahasa Indonesia", "col_type": "Jenis", "col_affix": "Afiks / kata", "col_function": "Fungsi", "col_example": "Contoh"};
const KIND = UI.kinds, TYPE = UI.types;
let section="main";
let levels={A:true,B:true,C:true};
let kinds={palabra:true,frase:true,raiz:true};
const q=document.getElementById("q"),list=document.getElementById("list"),stat=document.getElementById("stat");
function T(key,vars){let s=UI[key]||key;for(const k in (vars||{}))s=s.split("{"+k+"}").join(vars[k]);return s;}
function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/['’-]/g,"");}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function hi(s,term){s=esc(s);if(!term)return s;try{const re=new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");return s.replace(re,"<mark>$1</mark>");}catch(e){return s;}}
function render(){
  const raw=q.value.trim(),term=norm(raw);let html="",shown=0,total=0;
  if(section==="main"){
    let rows=DATA.main.filter(r=>levels[r.lv]&&kinds[r.k]);total=rows.length;
    rows=rows.filter(r=>!term||norm(r.t).includes(term)||norm(r.i).includes(term));shown=rows.length;
    html=rows.map(r=>`<div class="entry"><div class="head"><span class="tw">${hi(r.t,raw)}</span>
      <span class="badge ${r.lv}">${r.lv}${r.cf?"·"+r.cf:""}</span>${r.k!=="palabra"?`<span class="kind">${KIND[r.k]}</span>`:""}</div>
      <div class="gloss">${hi(r.i,raw)||"—"}</div>${r.m?`<div class="meta">${esc(r.m)}</div>`:""}</div>`).join("");
    stat.innerHTML=T("stat_main",{shown:shown,total:total,all:DATA.counts.main,A:DATA.counts.A,B:DATA.counts.B});
  }else if(section==="glos"){
    let rows=DATA.glos;total=rows.length;
    rows=rows.filter(r=>!term||norm(r.t).includes(term)||norm(r.i).includes(term)||norm(r.d).includes(term));shown=rows.length;
    html=rows.map(r=>`<div class="entry"><div class="head"><span class="tw">${hi(r.t,raw)}</span><span class="badge A">A</span></div>
      <div class="gloss"><em>${hi(r.i,raw)||"—"}</em></div>${r.d?`<div class="defn">${hi(r.d,raw)}</div>`:""}</div>`).join("");
    stat.innerHTML=T("stat_glos",{shown:shown,total:total});
  }else if(section==="prop"){
    let rows=DATA.prop;total=rows.length;
    rows=rows.filter(r=>!term||norm(r.t).includes(term)||norm(r.id).includes(term));shown=rows.length;
    html=`<div class="entry"><table><thead><tr><th>${UI.col_source}</th><th>${UI.col_type}</th><th>${UI.col_gloss}</th></tr></thead><tbody>`+
      rows.map(r=>`<tr><td>${hi(r.t,raw)}</td><td style="color:var(--muted)">${TYPE[r.ty]||r.ty}</td><td>${hi(r.id||r.t,raw)}</td></tr>`).join("")+`</tbody></table></div>`;
    stat.innerHTML=T("stat_prop",{shown:shown,total:total});
  }else{
    let mr=DATA.morf.filter(m=>!term||norm(m.join(" ")).includes(term));shown=mr.length;
    html=(DATA.morf.length?`<div class="note">${UI.morf_note}</div>`:"")+
      `<div class="entry"><table><thead><tr><th>${UI.col_affix}</th><th>${UI.col_function}</th><th>${UI.col_example}</th></tr></thead><tbody>`+
      mr.map(m=>`<tr><td>${hi(m[0],raw)}</td><td>${hi(m[1]||"",raw)}</td><td style="color:var(--muted)">${hi(m[2]||"",raw)}</td></tr>`).join("")+`</tbody></table></div>`;
    stat.innerHTML=T("stat_morf",{shown:shown});
  }
  list.innerHTML=html||`<div class="empty">${T("no_results",{q:esc(raw)})}</div>`;
}
q.addEventListener("input",render);
document.getElementById("tabs").addEventListener("click",e=>{
  if(!e.target.dataset.s)return;section=e.target.dataset.s;
  [...document.querySelectorAll(".tab")].forEach(t=>t.classList.toggle("active",t.dataset.s===section));
  document.getElementById("lvf").style.display=(section==="main")?"flex":"none";render();
});
document.getElementById("lvf").addEventListener("click",e=>{
  const lv=e.target.dataset.lv,k=e.target.dataset.k;
  if(lv){levels[lv]=!levels[lv];e.target.classList.toggle("on",levels[lv]);}
  else if(k){kinds[k]=!kinds[k];e.target.classList.toggle("on",kinds[k]);}
  else return;
  render();
});
render();
</script>
